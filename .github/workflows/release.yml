name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  linux:
    name: Linux (deb + tar.gz)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install X11 + PipeWire dev packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxi-dev libxtst-dev libasound2-dev libgtk-3-dev libpipewire-0.3-dev libspa-0.2-dev
      - name: Build and install Opus (static)
        # audiopus_sys probes pkg-config first and only falls back to the
        # vendored autotools build when no system Opus is found. That vendored
        # build links a shared libopus.so.0 without an embedded rpath, so the
        # binaries could not start ("libopus.so.0: cannot open shared object
        # file") - the smoke test added in v0.3.1 caught this (the v0.3.0
        # tar.gz had the same defect). Build Opus from the official source as
        # a PIC static library into /usr/local instead: pkg-config then finds
        # it and the linker picks libopus.a (no .so exists), which keeps the
        # binaries and the tar.gz self-contained - the same approach as the
        # macOS job.
        run: |
          curl -sL -o /tmp/opus.tar.gz https://downloads.xiph.org/releases/opus/opus-1.5.2.tar.gz
          tar -xzf /tmp/opus.tar.gz -C /tmp
          cd /tmp/opus-1.5.2
          ./configure --prefix=/usr/local --disable-shared --enable-static --with-pic --disable-doc --disable-extra-programs
          make -j3
          sudo make install
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
      - name: Build
        run: cargo build --release -p opacusr-app -p opacusr-agent -p opacusr-server
      - name: Test
        run: cargo test --workspace
      - name: Smoke test
        run: |
          ./target/release/opacusr-agent --version
          ./target/release/opacusr-server --version
      - name: Build debs
        run: |
          cargo install cargo-deb
          cargo deb --no-build -p opacusr-agent
          cargo deb --no-build -p opacusr-app
          cp target/debian/*.deb .
      - name: Package tar.gz
        run: |
          mkdir -p dist/opacusr-${GITHUB_REF_NAME#v}-linux-x86_64
          cp target/release/opacusr target/release/opacusr-agent target/release/opacusr-server \
             dist/opacusr-${GITHUB_REF_NAME#v}-linux-x86_64/
          cp README.md README.ru.md LICENSE dist/opacusr-${GITHUB_REF_NAME#v}-linux-x86_64/
          tar -czf opacusr-${GITHUB_REF_NAME#v}-linux-x86_64.tar.gz -C dist opacusr-${GITHUB_REF_NAME#v}-linux-x86_64
      - name: Build Wayland/PipeWire variant
        # Second build with the xdg-desktop-portal ScreenCast + PipeWire
        # backend enabled, for native-Wayland hosts. These binaries link
        # libpipewire-0.3.so.0 dynamically — present on every desktop
        # distro, absent on headless servers; the default (X11) artifacts
        # above stay fully self-contained, so Wayland support ships
        # separately instead of burdening them.
        run: cargo build --release -p opacusr-app -p opacusr-agent -p opacusr-server --features opacusr-capture/pipewire
      - name: Smoke test Wayland variant
        run: ./target/release/opacusr-agent --version
      - name: Package Wayland tar.gz
        run: |
          VER="${GITHUB_REF_NAME#v}"
          mkdir -p dist/opacusr-${VER}-linux-wayland-x86_64
          cp target/release/opacusr target/release/opacusr-agent target/release/opacusr-server \
             dist/opacusr-${VER}-linux-wayland-x86_64/
          cp README.md README.ru.md LICENSE dist/opacusr-${VER}-linux-wayland-x86_64/
          printf '%s\n' \
            'This build includes the PipeWire (xdg-desktop-portal ScreenCast)' \
            'capture backend for native Wayland sessions.' \
            '' \
            'Runtime requirement: libpipewire-0.3.so.0 (package libpipewire-0.3-0' \
            'on Debian/Ubuntu; preinstalled on any desktop distro).' \
            'On X11 sessions the regular build works the same way; this variant' \
            'additionally covers Wayland via the portal (a consent dialog pops' \
            'up on first share).' \
            > dist/opacusr-${VER}-linux-wayland-x86_64/WAYLAND.txt
          tar -czf opacusr-${VER}-linux-wayland-x86_64.tar.gz -C dist opacusr-${VER}-linux-wayland-x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: |
            opacusr-*-linux-x86_64.tar.gz
            opacusr-*-linux-wayland-x86_64.tar.gz
            *.deb

  windows:
    name: Windows (msi + zip)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
      - name: Build
        run: cargo build --release -p opacusr-app -p opacusr-agent -p opacusr-server
      - name: Test
        run: cargo test --workspace
      - name: Smoke test
        shell: pwsh
        run: |
          & target\release\opacusr-agent.exe --version
          & target\release\opacusr-server.exe --version
      - name: Install WiX Toolset v3
        run: |
          curl.exe -sLo wix311-binaries.zip https://github.com/wixtoolset/wix3/releases/download/wix3112rtm/wix311-binaries.zip
          Expand-Archive -Path wix311-binaries.zip -DestinationPath wix
          echo "$((Get-Location).Path)\wix" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build MSI
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          $ver = $env:GITHUB_REF_NAME.Substring(1)
          & wix\candle.exe -arch x64 "-dMsiVersion=$ver" wix\main.wxs -o build\main.wixobj
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & wix\light.exe -ext WixUIExtension build\main.wixobj -o "opacusr-$ver-x64.msi"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist\opacusr-$($env:GITHUB_REF_NAME.Substring(1))-windows-x86_64 | Out-Null
          Copy-Item target\release\opacusr.exe, target\release\opacusr-agent.exe, target\release\opacusr-server.exe, README.md, README.ru.md, LICENSE dist\opacusr-$($env:GITHUB_REF_NAME.Substring(1))-windows-x86_64\
          Compress-Archive -Path dist\opacusr-* opacusr-$($env:GITHUB_REF_NAME.Substring(1))-windows-x86_64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            opacusr-*-x64.msi
            opacusr-*-windows-x86_64.zip

  macos:
    name: macOS (tar.gz, experimental)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install pkg-config
        run: brew install pkg-config
      - name: Build and install Opus (static)
        # audiopus_sys probes pkg-config first and only falls back to the
        # vendored autotools build (needs autoreconf, absent on macOS
        # runners) when no system Opus is found. Official Opus release
        # tarballs ship a pre-generated ./configure, so no autotools are
        # needed here. Static linking keeps the artifact self-contained.
        run: |
          curl -sL -o /tmp/opus.tar.gz https://downloads.xiph.org/releases/opus/opus-1.5.2.tar.gz
          tar -xzf /tmp/opus.tar.gz -C /tmp
          cd /tmp/opus-1.5.2
          ./configure --prefix=/usr/local --disable-shared --enable-static --disable-doc --disable-extra-programs
          make -j3
          sudo make install
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
      - name: Build
        run: cargo build --release -p opacusr-app -p opacusr-agent -p opacusr-server
      - name: Ad-hoc codesign binaries
        # A valid signature is mandatory on Apple Silicon: arm64 macOS kills
        # a process whose Mach-O is unsigned or was modified after signing
        # (e.g. stripped). Ad-hoc signing needs no Apple Developer identity
        # and no notarization, and guarantees a valid signature inside the
        # tar.gz. Gatekeeper still shows a one-time warning on the first
        # launch of a quarantined download; the ways to clear it are
        # documented in README.md / README.ru.md
        # ("macOS: first launch (Gatekeeper)").
        run: |
          for bin in opacusr opacusr-agent opacusr-server; do
            codesign --force --sign - "target/release/$bin"
            codesign --verify --verbose=1 "target/release/$bin"
          done
      - name: Smoke test
        run: |
          ./target/release/opacusr-agent --version
          ./target/release/opacusr-server --version
      - name: Package tar.gz
        run: |
          VER="${GITHUB_REF_NAME#v}"
          mkdir -p dist/opacusr-${VER}-macos-aarch64
          cp target/release/opacusr target/release/opacusr-agent target/release/opacusr-server \
             dist/opacusr-${VER}-macos-aarch64/
          cp README.md README.ru.md LICENSE dist/opacusr-${VER}-macos-aarch64/
          tar -czf opacusr-${VER}-macos-aarch64.tar.gz -C dist opacusr-${VER}-macos-aarch64
      - uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: opacusr-*-macos-aarch64.tar.gz

  publish:
    name: Publish GitHub Release
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - name: Extract release notes from CHANGELOG.md
        run: |
          VER="${GITHUB_REF_NAME#v}"
          awk -v ver="$VER" '
            $0 ~ "^## \\[" ver "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release_body.md
          if [ ! -s release_body.md ]; then
            echo "::error::No '## [$VER]' section in CHANGELOG.md - add it before tagging."
            exit 1
          fi
          echo "--- release body ---"
          cat release_body.md
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.msi
            dist/*.deb
            dist/SHA256SUMS
          body_path: release_body.md
          generate_release_notes: true
