name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Keep CI disk usage sane; we don't need incremental state.
  CARGO_INCREMENTAL: 0

jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Linux — install dev packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxi-dev libxtst-dev libasound2-dev libgtk-3-dev libpipewire-0.3-dev libspa-0.2-dev

      - name: macOS — install Opus + pkg-config
        if: runner.os == 'macOS'
        # audiopus_sys probes pkg-config first; only when Opus is NOT found
        # does it fall back to building the vendored Opus via autotools —
        # and macOS runners have no autoreconf, so give it a system Opus.
        run: brew install opus pkg-config

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Clippy — Wayland/PipeWire capture (Linux)
        # wayland.rs is behind the opt-in `pipewire` feature; without this
        # step it would never be compiled anywhere and could rot silently
        # (the cursor overlay shipped two platform regressions that way).
        #
        # LIBCLANG_PATH pins clang 18: libspa-sys 0.8 builds its bindings
        # with bindgen 0.69, which misparses against the runner's default
        # LLVM 23 libclang (`spa_pod_builder` comes out as an opaque
        # `_address` blob and libspa fails to compile). LLVM 18 is the
        # newest that generates complete bindings for these headers.
        if: runner.os == 'Linux'
        env:
          LIBCLANG_PATH: /usr/lib/llvm-18/lib
        run: |
          sudo apt-get install -y libclang-18-dev
          cargo clippy -p opacusr-capture --features pipewire --all-targets -- -D warnings
          cargo clippy -p opacusr-capture --no-default-features --all-targets -- -D warnings

      - name: Clippy — agent cross-check for Windows (Linux)
        # The Windows-service supervisor in opacusr-agent is cfg(windows)
        # and would otherwise be compiled only by the release workflow on
        # tag push. Cross-check it on every push via mingw-w64 (audio is
        # off: the vendored Opus does not cross-build for windows-gnu).
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y mingw-w64
          rustup target add x86_64-pc-windows-gnu
          cargo clippy -p opacusr-agent --target x86_64-pc-windows-gnu --no-default-features -- -D warnings

      - name: Tests
        # macOS: the bundled OpenH264 crashes (foreign-exception abort or
        # SIGSEGV) when several e2e tests instantiate encoders/decoders
        # concurrently in one process — serialize the harness there. Unit
        # tests are fast, so the single-threaded suite stays cheap.
        #
        # macOS: even single-threaded the vendored OpenH264 rarely still
        # aborts an e2e test with "Rust cannot catch foreign exceptions"
        # or SIGSEGV (seen on the v0.7.0 release runs, and on 45929571018
        # where a passing retry STILL left the job red because the retry
        # lived in its own step). The retry therefore lives INSIDE this
        # step: a green retry clears the flake, a real regression fails
        # both attempts and stays red.
        # shell: bash — Windows runners default to pwsh, which chokes on
        # the `if ! cargo …; then` guard below (seen on run 45935657748).
        # All three runners ship bash, so pin it explicitly.
        shell: bash
        run: |
          if ! cargo test --workspace; then
            if [ "$RUNNER_OS" = "macOS" ]; then
              echo "::warning::macOS vendored-OpenH264 flake detected — retrying the suite once"
              cargo test --workspace
            else
              exit 1
            fi
          fi
        env:
          RUST_TEST_THREADS: ${{ runner.os == 'macOS' && '1' || '4' }}

  mobile:
    name: Mobile cross-check (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: aarch64-linux-android
          - os: macos-latest
            target: aarch64-apple-ios
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Android — install NDK
        if: runner.os == 'Linux'
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27b
          add-to-path: false

      - name: Android — cargo check (GUI glue + client core)
        if: runner.os == 'Linux'
        env:
          ANDROID_NDK_ROOT: ${{ steps.ndk.outputs.ndk-path }}
          CC_aarch64_linux_android: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
          CXX_aarch64_linux_android: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++
          AR_aarch64_linux_android: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
        run: cargo check -p opacusr-android --target aarch64-linux-android

      - name: Android — compile the Java shim + link the manifest (javac/aapt2)
        # The release APK is packaged by scripts/package_android.sh (javac
        # + d8 + aapt2). Without this step a Java/manifest error would
        # only surface at the release tag — hours after the push.
        if: runner.os == 'Linux'
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          JAR="$ANDROID_HOME/platforms/android-34/android.jar"
          test -f "$JAR" || { echo "platform android-34 missing"; exit 1; }
          BT="$(ls -d "$ANDROID_HOME"/build-tools/34* 2>/dev/null | sort -V | tail -1)"
          test -n "$BT" || { echo "build-tools 34 missing"; exit 1; }
          mkdir -p /tmp/shim-classes
          javac --release 8 -classpath "$JAR" -d /tmp/shim-classes \
            crates/opacusr-android/java/io/opacusr/app/*.java
          "$BT/aapt2" compile --dir crates/opacusr-android/res -o /tmp/res.zip
          "$BT/aapt2" link -o /tmp/shim-base.apk -I "$JAR" \
            --manifest crates/opacusr-android/AndroidManifest.xml \
            --min-sdk-version 24 --target-sdk-version 34 \
            /tmp/res.zip
          echo "Java shim + manifest OK"

      - name: "iOS — cargo check (pure core: proto + crypto)"
        # Full client is blocked upstream for now: webrtc 0.14 →
        # webrtc-util 0.12 → nix 0.26, whose socket module references
        # libc::sockaddr_ctl — defined for macOS but NOT for iOS — so
        # `opacusr-client` cannot build for aarch64-apple-ios until the
        # webrtc stack bumps nix. The pure-Rust core still proves the
        # toolchain + proto/crypto layer are iOS-clean.
        if: runner.os == 'macOS'
        run: cargo check -p opacusr-proto -p opacusr-crypto --target aarch64-apple-ios
