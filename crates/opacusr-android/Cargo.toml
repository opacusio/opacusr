[package]
name = "opacusr-android"
description = "OpacusR Android app: NativeActivity glue around the egui UI"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

# NativeActivity loads this cdylib (libopacusr_android.so) — the whole
# egui UI from opacusr-app runs inside it.
[lib]
crate-type = ["cdylib"]

# cargo-apk manifest: OpacusR.apk, arm64-v8a, screen-sharing viewer.
[package.metadata.android]
package = "io.opacusr.app"
apk_name = "OpacusR"
build_targets = ["aarch64-linux-android"]

# WITHOUT INTERNET Android refuses EVERY socket() — including loopback —
# so the agent could never register («регистрация на сервере…» forever,
# v0.11.9/0.11.10 APKs shipped with zero permissions). The embedded
# signaling listener binds a port too, so INTERNET covers bind+connect;
# ACCESS_NETWORK_STATE lets us read connectivity for diagnostics.
[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

[[package.metadata.android.uses_permission]]
name = "android.permission.ACCESS_NETWORK_STATE"

# WifiManager.MulticastLock (acquired by the raw-JNI helper in android_
# main so mDNS «Контакты» discovery can RECEIVE multicast) requires
# CHANGE_WIFI_MULTICAST_STATE — without it acquire() throws
# SecurityException and our best-effort helper degrades to a log line
# (v0.11.17 shipped without it; normal permission, auto-granted).
[[package.metadata.android.uses_permission]]
name = "android.permission.CHANGE_WIFI_MULTICAST_STATE"

[package.metadata.android.sdk]
min_sdk_version = 24
# 34: GitHub ubuntu-latest runners preinstall platform 34 (30 is NOT
# in the preinstalled image — "Platform 30 is not installed" on
# `cargo apk build`).
target_sdk_version = 34

[package.metadata.android.application]
label = "OpacusR"
# The default signaling endpoints are cleartext `ws://` (the embedded
# loopback listener and LAN `ip:port` servers). Our WebSockets are
# native Rust sockets, which the platform's cleartext switch does not
# inspect anyway, but declare it so any future JVM-side HTTP usage
# (update checks, metrics) is not silently blocked on API 28+.
uses_cleartext_traffic = true

[package.metadata.android.application.activity]
orientation = "fullUser"
launch_mode = "singleTop"
theme = "@android:style/Theme.DeviceDefault.NoActionBar.Fullscreen"
resizeable_activity = true

[dependencies]
# Raw JNI vtable access for the WiFiManager.MulticastLock (mDNS
# multicast receive): the same jni-sys android-activity already uses,
# so no second jni runtime is pulled in. Needed on ALL targets: the
# acquisition helper is ungated so the desktop build type-checks it.
jni-sys = "0.4"
tracing = { workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
opacusr-app = { workspace = true }
egui = { workspace = true }
eframe = { workspace = true, features = ["android-native-activity"] }
winit = { version = "0.30", default-features = false, features = ["android-native-activity"] }
tracing-subscriber = { workspace = true }
