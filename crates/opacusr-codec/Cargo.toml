[package]
name = "opacusr-codec"
description = "OpacusR video frame codecs (JPEG + H.264 via openh264)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
default = ["h264"]
# Cisco OpenH264 compiled from the bundled BSD-licensed source.
h264 = ["dep:openh264"]

[dependencies]
opacusr-capture = { workspace = true }
opacusr-proto = { workspace = true }
image = { workspace = true }
openh264 = { version = "0.8", optional = true }
tracing = { workspace = true }
thiserror = { workspace = true }
