[package]
name = "opacusr-agent"
description = "OpacusR host agent: capture, input, files, terminal, unattended access"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[[bin]]
name = "opacusr-agent"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
opacusr-proto = { workspace = true }
opacusr-crypto = { workspace = true }
opacusr-transport = { workspace = true }
opacusr-server = { workspace = true }
opacusr-capture = { workspace = true }
opacusr-codec = { workspace = true }
opacusr-input = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
dirs = { workspace = true }
rand = { workspace = true }
sha2 = { workspace = true }
mp4 = { workspace = true }
rpassword = "7"

# OS keychain for the unattended password. Windows/macOS use their native
# stores; Linux uses the Secret Service (GNOME Keyring/KWallet) with a
# *vendored* libdbus so no system dbus package is required. Headless Linux
# without a secret service simply errors → the agent falls back to the
# 0600 config file (see src/keychain.rs).
[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
keyring = { version = "3", features = ["apple-native", "windows-native"] }

[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "ios", target_os = "android"))))'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust", "vendored"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
portable-pty = { workspace = true }
arboard = { workspace = true }
audiopus = { workspace = true, optional = true }

# Audio capture. Windows uses WASAPI loopback directly (see src/audio.rs);
# Unix/macOS go through cpal (mic / any input device). Optional so hosts
# without ALSA dev headers can build with `--no-default-features`.
[target.'cfg(not(any(target_os = "windows", target_os = "android", target_os = "ios")))'.dependencies]
cpal = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
] }

[dev-dependencies]
tempfile = { workspace = true }
# no default features: tests must build on hosts without ALSA headers;
# the e2e test never exercises the audio path itself
opacusr-client = { workspace = true, default-features = false }

[features]
# Audio streaming (Opus). Default on; opt out for toolchains where the
# vendored opus build is unavailable (e.g. windows-gnu cross builds).
default = ["audio"]
audio = ["dep:audiopus", "dep:cpal"]

[package.metadata.deb]
maintainer = "OpacusR contributors <opacusio@users.noreply.github.com>"
copyright = "2026, OpacusR contributors"
license-file = ["../../LICENSE", "0"]
extended-description = """\
OpacusR host agent — accepts remote sessions, streams the screen, executes \
input, serves file transfers, chat and an interactive terminal. Supports \
unattended access protected by a challenge-response password check \
(Argon2id + ChaCha20-Poly1305 end-to-end encryption)."""
section = "net"
priority = "optional"
depends = "$auto, libx11-6, libxtst6, libxi6, libasound2"
assets = [
    ["target/release/opacusr-agent", "usr/bin/opacusr-agent", "755"],
    ["../../assets/opacusr-agent.service", "usr/lib/systemd/user/opacusr-agent.service", "644"],
]
