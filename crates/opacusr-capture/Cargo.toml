[package]
name = "opacusr-capture"
description = "OpacusR screen capture backends (X11, Windows GDI/DXGI, macOS CoreGraphics, PipeWire portal, test source)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
thiserror = { workspace = true }
tracing = { workspace = true }
# ScreenDesc / OutputMapping (the capture↔input coordinate-space
# contract) live in the proto crate alongside ScreenInfo.
opacusr-proto = { workspace = true }
x11rb = { workspace = true, optional = true }
# android_projection (MediaProjection host backend) — raw vtable JNI,
# compiled on ALL targets so the desktop build type-checks the wiring
# (same discipline as opacusr-android).
jni-sys = "0.4"

[target.'cfg(target_os = "linux")'.dependencies]
# Wayland (PipeWire) capture — optional, experimental. See src/wayland.rs.
# The xdg-desktop-portal asks the user which monitor to share.
ashpd = { version = "0.9", optional = true, default-features = false, features = [
    "async-std",
] }
pipewire = { version = "0.8", optional = true }
async-std = { version = "1", optional = true }
# Output-layout probe (wayland_layout.rs): enumerates the compositor's
# monitors once per portal negotiation so the consent-dialog streams get
# real names and uinput gets the per-output input mapping. Pure-Rust wire
# implementation — no wayland-sys, nothing to link.
wayland-client = { version = "0.31", optional = true }
wayland-protocols = { version = "0.32", optional = true, features = ["unstable", "client"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
] }
# Rich COM bindings for DXGI Desktop Duplication (dxgi.rs).
windows = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
] }

[build-dependencies]
# sck_shim.m (the ScreenCaptureKit ObjC bridge) — build.rs invokes cc
# only when CARGO_CFG_TARGET_OS is "macos" (SCK does not exist on iOS,
# other targets have no use for the shim either). The dependency is
# unconditional because build scripts are compiled for every target.
cc = "1"

[features]
default = ["x11"]
x11 = ["dep:x11rb"]
pipewire = [
    "dep:ashpd",
    "dep:pipewire",
    "dep:async-std",
    "dep:wayland-client",
    "dep:wayland-protocols",
]
