[package]
name = "opacusr-capture"
description = "OpacusR screen capture backends (X11, Windows GDI, macOS stub, test source)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
thiserror = { workspace = true }
tracing = { workspace = true }
x11rb = { workspace = true, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
# Wayland (PipeWire) capture — optional, experimental. See src/wayland.rs.
# The xdg-desktop-portal asks the user which monitor to share.
ashpd = { version = "0.9", optional = true, default-features = false, features = [
    "async-std",
] }
pipewire = { version = "0.8", optional = true }
async-std = { version = "1", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
] }
# Rich COM bindings for DXGI Desktop Duplication (dxgi.rs).
windows = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
] }

[features]
default = ["x11"]
x11 = ["dep:x11rb"]
pipewire = ["dep:ashpd", "dep:pipewire", "dep:async-std"]
