[package]
name = "opacusr-transport"
description = "OpacusR transports: TCP (LAN/tests), WebRTC data channels, relay, secure session"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
ureq = { version = "2", default-features = false, features = ["tls"] }
opacusr-proto = { workspace = true }
opacusr-crypto = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tokio-tungstenite = { workspace = true, features = ["rustls-tls-webpki-roots"] }
# Direct dep so we can pin the process-wide crypto provider (see
# `ensure_rustls_crypto_provider` in lib.rs): the WebRTC stack uses ring
# while rust-libp2p compiles aws-lc-rs into the same rustls.
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }
serde_json = "1"
bincode = { workspace = true }
bytes = "1"
sha2 = { workspace = true }
base64 = { workspace = true }
tempfile = { workspace = true }

# The WebRTC data-channel stack is NOT built for iOS: webrtc 0.14 →
# webrtc-util 0.12 → nix 0.26 references `libc::sockaddr_ctl` — defined
# for macOS but absent for iOS — so the whole chain fails to compile for
# aarch64-apple-ios. iOS viewers ride the TCP relay / LAN-direct paths
# instead (`TransportChoice::Auto` degrades automatically there; see
# opacusr-client/src/session.rs).
[target.'cfg(not(target_os = "ios"))'.dependencies]
webrtc = { workspace = true }

[target.'cfg(unix)'.dependencies]
tar = "0.4"
flate2 = "1"

[target.'cfg(windows)'.dependencies]
zip = { version = "9", default-features = false, features = ["deflate"] }

[dev-dependencies]
rand = { workspace = true }
