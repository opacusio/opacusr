[package]
name = "opacusr-app"
description = "OpacusR desktop GUI (egui): connect, view, control, chat, files, terminal"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[[bin]]
name = "opacusr"
path = "src/main.rs"

[dependencies]
if-addrs = "0.14"
opacusr-proto = { workspace = true }
opacusr-crypto = { workspace = true }
opacusr-transport = { workspace = true }
opacusr-capture = { workspace = true }
opacusr-codec = { workspace = true }
opacusr-input = { workspace = true }
eframe = { workspace = true }
egui = { workspace = true }
raw-window-handle = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
dirs = { workspace = true }
image = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
mdns-sd = { workspace = true }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
# Desktop: the workspace entry carries default-features = false (mobile
# targets build the agent without audio — the Opus vendored build is
# not wired for NDK); the desktop GUI opts back into audio streaming.
opacusr-agent = { workspace = true, features = ["audio"] }
opacusr-client = { workspace = true, features = ["audio"] }
arboard = { workspace = true }
# Native file dialogs (desktop). Mobile callers use the cfg-gated
# helpers in lib.rs (`pick_file`/`pick_files`/`pick_folder`), which
# return None where there is no XDG dialog.
rfd = { workspace = true }

# Embedded libp2p node for the experimental decentralized mode
# (Настройки → Децентрализованный) — desktop AND Android. No new
# native build on Android: aws-lc-rs/ring are already in the APK
# dependency graph via opacusr-transport (webrtc/dtls → rustls), and
# libp2p itself (tokio/tcp/noise/yamux/quic/dns/kad…) is pure Rust +
# quinn, which CI already compiles for aarch64-linux-android. iOS is
# excluded — the app is not built there (CI compiles only
# proto+crypto for aarch64-apple-ios).
[target.'cfg(not(target_os = "ios"))'.dependencies]
opacusr-libp2p = { workspace = true }

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
opacusr-client = { workspace = true }
# Mobile: the agent lib without its audio feature — a phone never
# hosts a session (no capture backend).
opacusr-agent = { workspace = true }

# System tray (TeamViewer-style background operation). Linux is
# deliberately excluded: the tray-icon Linux backends need GTK /
# libappindicator system packages that are not part of the CI image.
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
tray-icon = { version = "0.26", default-features = false }

# DWM dark title bar / border (see app::apply_native_chrome), the
# single-instance guard (mutex/event) and the elevated service install
# (ShellExecuteExW runas).
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Security",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
] }
# SCM status query for the «Служба Windows» settings row.
windows-service = { workspace = true }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[package.metadata.deb]
maintainer = "OpacusR contributors <opacusio@users.noreply.github.com>"
copyright = "2026, OpacusR contributors"
license-file = ["../../LICENSE", "0"]
extended-description = """\
OpacusR viewer — connect to an OpacusR host, watch and control the remote \
desktop, transfer files, chat and open a remote terminal. WebRTC data \
channels with TCP relay fallback, end-to-end encrypted."""
section = "net"
priority = "optional"
depends = "$auto, libx11-6, libxtst6, libxi6"
assets = [
    ["target/release/opacusr", "usr/bin/opacusr", "755"],
    ["../../assets/opacusr.desktop", "usr/share/applications/opacusr.desktop", "644"],
    ["../../assets/opacusr.png", "usr/share/icons/hicolor/256x256/apps/opacusr.png", "644"],
]
