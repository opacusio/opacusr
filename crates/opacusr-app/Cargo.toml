[package]
name = "opacusr-app"
description = "OpacusR desktop GUI (egui): connect, view, control, chat, files, terminal"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[[bin]]
name = "opacusr"
path = "src/main.rs"

[dependencies]
opacusr-proto = { workspace = true }
opacusr-crypto = { workspace = true }
opacusr-transport = { workspace = true }
opacusr-capture = { workspace = true }
opacusr-codec = { workspace = true }
# The workspace entry carries `default-features = false` so hosts without
# ALSA headers can build the agent tests; the GUI opts back into audio.
opacusr-client = { workspace = true, features = ["audio"] }
opacusr-agent = { workspace = true }
eframe = { workspace = true }
egui = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
dirs = { workspace = true }
image = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
rfd = { workspace = true }
mdns-sd = { workspace = true }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
arboard = { workspace = true }

# System tray (TeamViewer-style background operation). Linux is
# deliberately excluded: the tray-icon Linux backends need GTK /
# libappindicator system packages that are not part of the CI image.
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
tray-icon = { version = "0.26", default-features = false }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[package.metadata.deb]
maintainer = "OpacusR contributors <opacusio@users.noreply.github.com>"
copyright = "2026, OpacusR contributors"
license-file = ["../../LICENSE", "0"]
extended-description = """\
OpacusR viewer — connect to an OpacusR host, watch and control the remote \
desktop, transfer files, chat and open a remote terminal. WebRTC data \
channels with TCP relay fallback, end-to-end encrypted."""
section = "net"
priority = "optional"
depends = "$auto, libx11-6, libxtst6, libxi6"
assets = [
    ["target/release/opacusr", "usr/bin/opacusr", "755"],
    ["../../assets/opacusr.desktop", "usr/share/applications/opacusr.desktop", "644"],
    ["../../assets/opacusr.png", "usr/share/icons/hicolor/256x256/apps/opacusr.png", "644"],
]
