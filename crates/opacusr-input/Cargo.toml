[package]
name = "opacusr-input"
description = "OpacusR input injection backends (mouse/keyboard) and clipboard helper"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
opacusr-proto = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
# Raw JNI vtable access for the Android accessibility bridge (ungated:
# the desktop build type-checks the wiring, android_bridge never runs
# off-Android because set_context is only called from android_main).
jni-sys = "0.4"
# PNG encode/decode for image clipboard sync (headless-safe helpers).
image = { workspace = true }

# macOS only: the global device-px → event-points bridge for remote
# input (opacusr_capture::macos::px_to_pt_global) — enigo/CoreGraphics
# events speak points, the protocol speaks streamed-frame pixels.
[target.'cfg(target_os = "macos")'.dependencies]
opacusr-capture = { workspace = true }

# evdev grabs for the physical input lock (Linux).
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
libc = "0.2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
enigo = { workspace = true }
arboard = { workspace = true }
