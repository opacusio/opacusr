# OpacusR coturn configuration (STUN/TURN for WebRTC NAT traversal).
# Mounted into the coturn container by docker-compose.yml.
#
# Replace the secret below before production use:
#   openssl rand -hex 32

listening-port=3478

# TLS (optional, requires certificates):
# listening-tls-port=5349
# cert=/etc/coturn/certs/turn.pem
# pkey=/etc/coturn/certs/turn.key

# Relay port range (must match the published ports in docker-compose.yml).
min-port=49160
max-port=49200

# Use the time-limited credential mechanism (REST API style, shared secret).
use-auth-secret
static-auth-secret=CHANGE_ME_opacusr_turn_secret

realm=opacusr
server-name=opacusr

# Log to stdout so `docker logs` works.
no-cli
log-file=stdout
simple-log

# Do not act as an open relay to arbitrary destinations beyond RFC1918 checks.
# Uncomment to restrict relaying to private networks only (server-side deployments):
# allowed-peer-ip=10.0.0.0-10.255.255.255
# allowed-peer-ip=172.16.0.0-172.31.255.255
# allowed-peer-ip=192.168.0.0-192.168.255.255

fingerprint
no-multicast-peers
