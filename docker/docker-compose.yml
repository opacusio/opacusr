# OpacusR self-hosted stack: signaling/relay server + STUN/TURN.
#
# Usage:
#   cd docker
#   # 1. Generate a TURN secret once:
#   SECRET="$(openssl rand -hex 32)"
#   sed -i 's/CHANGE_ME_opacusr_turn_secret/'"$SECRET"'/' turnserver.conf
#   # 2. Give the same secret to the signaling server (it mints
#   #    time-limited credentials at GET /turn):
#   echo "OPACUSR_TURN_SECRET=$SECRET" > .env
#   # 3. Start:
#   docker compose up -d
#   # 4. Check:
#   curl http://localhost:8080/health
#
# Then point OpacusR clients at:
#   Signaling: ws://<host>:8080/signal
#   Relay:     <host>:8081
#   ICE:       stun:<host>:3478   and/or   turn:<host>:3478 (time-limited credentials: GET /turn)

services:
  signaling:
    build:
      context: ..
      dockerfile: docker/server.Dockerfile
    image: opacusr/server:latest
    container_name: opacusr-signaling
    restart: unless-stopped
    ports:
      - "8080:8080" # WebSocket signaling (ws://.../signal) + health (http://.../health)
      - "8081:8081" # TCP relay fallback
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      # Time-limited TURN credentials (GET /turn). Must equal
      # static-auth-secret in turnserver.conf (see step 1 above).
      OPACUSR_TURN_SECRET: ${OPACUSR_TURN_SECRET:-}
      # Optional tuning (defaults shown):
      # OPACUSR_TURN_TTL_SECS: "3600"
      # OPACUSR_MAX_PEERS: "1024"
      # OPACUSR_RATE_MAX: "20"
      # OPACUSR_RATE_WINDOW_SECS: "10"
    healthcheck:
      test: ["CMD-SHELL", "command -v curl >/dev/null && curl -fsS http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  coturn:
    image: coturn/coturn:latest
    container_name: opacusr-coturn
    restart: unless-stopped
    # coturn needs real peer addresses; host networking is the recommended setup.
    # If host networking is not possible, publish 3478/udp+tcp and 49160-49200/udp
    # and set external-ip=<public-ip> in turnserver.conf.
    network_mode: host
    volumes:
      - ./turnserver.conf:/etc/coturn/turnserver.conf:ro
    # Ports are bound directly by coturn when using host networking:
    #   3478/udp+tcp  — STUN/TURN
    #   49160-49200/udp — relay range
