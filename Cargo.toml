[workspace]
resolver = "2"
members = [
    "crates/opacusr-proto",
    "crates/opacusr-crypto",
    "crates/opacusr-transport",
    "crates/opacusr-capture",
    "crates/opacusr-codec",
    "crates/opacusr-input",
    "crates/opacusr-agent",
    "crates/opacusr-client",
    "crates/opacusr-server",
    "crates/opacusr-app",
]

[workspace.package]
version = "0.11.2"
edition = "2021"
license = "AGPL-3.0-or-later"
authors = ["OpacusR contributors"]
repository = "https://github.com/opacusio/opacusr"
homepage = "https://github.com/opacusio"
description = "OpacusR — self-hosted open-source remote desktop (TeamViewer alternative)"

[workspace.dependencies]
opacusr-proto = { path = "crates/opacusr-proto", version = "0.11.1" }
opacusr-crypto = { path = "crates/opacusr-crypto", version = "0.11.1" }
opacusr-transport = { path = "crates/opacusr-transport", version = "0.11.1" }
opacusr-capture = { path = "crates/opacusr-capture", version = "0.11.1" }
opacusr-codec = { path = "crates/opacusr-codec", version = "0.11.1" }
opacusr-input = { path = "crates/opacusr-input", version = "0.11.1" }
opacusr-agent = { path = "crates/opacusr-agent", version = "0.11.1" }
opacusr-client = { path = "crates/opacusr-client", version = "0.11.1", default-features = false }
opacusr-server = { path = "crates/opacusr-server", version = "0.11.1" }
opacusr-app = { path = "crates/opacusr-app", version = "0.11.1" }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "fs", "signal"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
# 2.x wire format differs from 1.x (varint ints) — bumped PROTO_VERSION to 9
# in the same batch; peers must be 0.11.1+ on both sides.
bincode = { version = "2", features = ["serde"] }
base64 = "0.23"
thiserror = "2"
anyhow = "1"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.8"
zeroize = { version = "1", features = ["zeroize_derive"] }

sha2 = "0.10"
hmac = "0.12"
hkdf = "0.12"
argon2 = "0.6"
chacha20poly1305 = { version = "0.10", features = ["std"] }
sha1 = "0.10"

axum = { version = "0.8", features = ["ws", "json"] }
tokio-tungstenite = "0.30"

image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
mp4 = "0.14"
x11rb = { version = "0.13", features = ["randr", "xfixes"] }
enigo = "0.6"
arboard = "3"
portable-pty = "0.8"
cpal = "0.15"
audiopus = "0.2"

clap = { version = "4", features = ["derive"] }
toml = "1.1"
dirs = "6"
rpassword = "7"
windows-service = "0.8"

webrtc = "0.14"
eframe = "0.29"
egui = "0.29"
# The GUI reads the native window handle to switch the Windows title
# bar / border to the dark theme (DWM) — the part of the window egui
# does not paint.
raw-window-handle = "0.6"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm"] }
mdns-sd = "0.14"

tempfile = "3"
rfd = "0.15"

[profile.release]
opt-level = 3
lto = "thin"
strip = true

[profile.dev]
incremental = false
debug = 0
